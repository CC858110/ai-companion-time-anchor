name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run time-expression regression tests
        run: python tests/test_time_expression.py

      - name: Run hook input regression tests
        run: python tests/test_stdin_bom.py
